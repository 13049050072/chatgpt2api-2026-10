name: images

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install dependencies
        run: uv sync --frozen --no-dev --no-install-project
      - name: Sentinel / clearance regression tests
        run: |
          uv run python -m unittest \
            test.test_clearance_solver \
            test.test_cloudflare_retry \
            test.test_fingerprint_consistency \
            test.test_sentinel_handshake \
            test.test_image_stream_retry \
            test.test_init_proxy_config \
            test.test_proxy_runtime_config \
            test.test_proxy_service

  build-app:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push app image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ghcr.io/sakuralaaa/chatgpt2api-2026-10:latest

  build-solver:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push solver image
        uses: docker/build-push-action@v6
        with:
          context: ./sentinel_solver
          file: ./sentinel_solver/Dockerfile
          push: true
          tags: ghcr.io/sakuralaaa/chatgpt2api-2026-10-sentinel-solver:latest
